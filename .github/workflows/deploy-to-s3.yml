name: S3-CI
run-name: Deploying to S3
on:
  push:
    branches: [ "main" ]
    paths:
      - "website/**"
      - ".github/workflows/deploy-to-s3.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: website

permissions:
  id-token: write
  contents: read

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROOT_ROLE_ARN }}
          role-session-name: github-actions-s3-sync
          aws-region: eu-west-1
      
      - name: Deploy to S3
        run: |
          # Hashed build assets never change, so cache them for a year
          aws s3 sync out/_next s3://milad.cloud/_next --delete \
            --cache-control "public,max-age=31536000,immutable"
          # Everything else (HTML, RSC payloads, images) revalidates quickly
          aws s3 sync out s3://milad.cloud --delete \
            --exclude "_next/*" \
            --cache-control "public,max-age=300"

      - name: Invalidate CloudFront
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
