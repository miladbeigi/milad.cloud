<title>Glimpse Site Proposals</title>
<style>

<style>
/* Layout: a contact sheet; one card per proposal, thumbnail first, the idea in two lines. */
:root {
  --bg: #f3f4f6; --card: #ffffff; --fg: #15171c; --muted: #5d6270; --line: #dfe2e8; --accent: #2f6bff;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1115; --card: #171a21; --fg: #eef0f4; --muted: #9aa1b0; --line: #262b35; --accent: #6f98ff; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0f1115; --card: #171a21; --fg: #eef0f4; --muted: #9aa1b0; --line: #262b35; --accent: #6f98ff; color-scheme: dark }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 48px 72px; }
header { display: grid; gap: 10px; max-width: 70ch; margin-bottom: 36px; }
h1 { font-family: var(--display); font-size: clamp(28px, 4vw, 44px); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 22px; list-style: none; margin: 0; padding: 0; }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.card a.thumb { display: block; aspect-ratio: 16 / 10; overflow: hidden; background: var(--line); border-bottom: 1px solid var(--line); }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform .4s ease; }
.card a.thumb:hover img { transform: scale(1.03); }
.meta { padding: 16px 18px 18px; display: grid; gap: 6px; align-content: start; }
.num { font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-variant-numeric: tabular-nums; }
h2 { font-family: var(--display); font-size: 21px; margin: 0; line-height: 1.2; }
h2 a { color: inherit; text-decoration: none; }
h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.meta p { margin: 0; color: var(--muted); font-size: 14.5px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .card img { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Glimpse, ten looks</h1>
    <p>Round 2. Every page tells the same short story: four tools you use, one app in the menu bar. Only the look changes.</p>
  </header>
  <ul class="grid" id="grid"></ul>
</div>

<script>
const designs = [
  ["01", "the-loop", "The Loop", "Light Swiss grid. The four jobs sit on a ring around the icon."],
  ["02", "workbench", "The Workbench", "Dark and cinematic. Each job is a spotlit scene."],
  ["03", "a-day", "Daylight", "Keynote rhythm in daylight colours, from morning white to dusk."],
  ["04", "keynote", "Keynote", "Seven full-screen slides on a dark stage. Arrow keys to move."],
  ["05", "one-app", "Keynote Light", "Keynote restraint on white, like a product page."],
  ["06", "conversation", "Paper", "Quiet paper and ink, each job a printed card."],
  ["07", "map", "Four Tiles", "One board of four tiles opens the page; each leads to its job."],
  ["08", "blueprint", "Blueprint", "The icon drawn on blueprint paper, four leader lines to four jobs."],
  ["09", "keyboard", "Four Keys", "Four big keycaps; press one to show that job."],
  ["10", "desktop", "The Desktop", "A calm Mac desktop; the Dock opens each job as a window."],
];
const grid = document.getElementById("grid");
for (const [n, slug, name, idea] of designs) {
  const href = `${n}-${slug}.html`;
  const li = document.createElement("li");
  li.className = "card";
  li.innerHTML = `<a class="thumb" href="${href}" aria-label="Open design ${n}, ${name}"><img src="thumbs/${n}.webp" alt="" loading="lazy" width="1440" height="900"></a>
    <div class="meta"><span class="num">Design ${n}</span><h2><a href="${href}">${name}</a></h2><p>${idea}</p></div>`;
  grid.append(li);
}
</script>
</body>
</html>
